<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题练习</title>
    <style>
        :root {
            --ink: #111827;
            --ink-2: #4b5563;
            --ink-3: #6b7280;
            --muted: #9ca3af;
            --line: #eceef3;
            --line-2: #e5e7f0;
            --brand: #4f46e5;
            --brand-2: #6366f1;
            --ok: #16a34a;
            --ok-bg: #f2fdf5;
            --ok-line: #bbf7d0;
            --bad: #dc2626;
            --bad-bg: #fef4f4;
            --bad-line: #fecaca;
            --surface: #fff;
            --bg: #f6f7fb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100%;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }
        /* 背景光斑：与首页同一套语言 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        body::before { width: 420px; height: 420px; background: rgba(99,102,241,.13); top: -180px; left: -120px; }
        body::after  { width: 380px; height: 380px; background: rgba(236,72,153,.07); bottom: -200px; right: -130px; }

        /* ============ 顶部栏 ============ */
        .topbar {
            position: sticky; top: 0; z-index: 60;
            background: rgba(255,255,255,.86);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .topbar-inner {
            max-width: 880px; margin: 0 auto;
            display: flex; align-items: center; gap: 14px;
            padding: 12px 22px;
        }
        .icon-btn {
            width: 38px; height: 38px; flex: none;
            display: flex; align-items: center; justify-content: center;
            border: none; border-radius: 12px;
            background: #f3f4f8; color: var(--ink-2);
            cursor: pointer; text-decoration: none;
            transition: background .16s ease, color .16s ease;
        }
        .icon-btn:hover { background: #e9ebf3; color: var(--ink); }
        .icon-btn.danger:hover { background: #fef2f2; color: var(--bad); }
        .icon-btn svg { width: 19px; height: 19px; stroke: currentColor; }

        .topbar-meta { flex: 1; min-width: 0; }
        .topbar-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .topbar-title { font-size: 16px; font-weight: 650; letter-spacing: .2px; }
        .mode-tag {
            font-size: 11.5px; font-weight: 600; letter-spacing: .3px;
            color: var(--brand); background: #eef0ff;
            padding: 2px 7px; border-radius: 6px;
        }
        .mode-tag.wrong { color: #b45309; background: #fff7e6; }
        .topbar-stats {
            display: flex; align-items: center; gap: 7px;
            margin-top: 3px; font-size: 12.5px; color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .topbar-stats b { color: var(--ink-2); font-weight: 650; }
        .topbar-stats .sep { opacity: .45; }

        .topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
        .pill-btn {
            height: 38px; padding: 0 16px;
            border: 1px solid var(--line-2); border-radius: 12px;
            background: #fff; color: var(--ink-2);
            font-family: inherit; font-size: 13.5px; font-weight: 600;
            cursor: pointer; white-space: nowrap;
            transition: border-color .16s ease, color .16s ease, background .16s ease;
        }
        .pill-btn:hover { border-color: #c7cbf5; color: var(--brand); background: #fafbff; }
        .pill-btn.active { background: #eef0ff; border-color: #d6d9fb; color: var(--brand); }

        .progress-rail { height: 2px; background: #f0f1f7; }
        .progress-rail i {
            display: block; height: 100%; width: 0;
            background: linear-gradient(90deg, var(--brand), #8b5cf6);
            transition: width .35s ease;
        }

        /* ============ 主体 ============ */
        .stage {
            position: relative; z-index: 1;
            max-width: 880px; margin: 0 auto;
            padding: 28px 22px 60px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 30px 34px 26px;
            box-shadow: 0 1px 2px rgba(17,24,39,.03), 0 14px 34px rgba(17,24,39,.06);
        }

        /* 题卡头部 */
        .card-head {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding-bottom: 15px; margin-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }
        .type-pill {
            font-size: 12.5px; font-weight: 650; letter-spacing: .3px;
            color: var(--brand); background: #eef0ff;
            padding: 5px 10px; border-radius: 8px;
        }
        .type-pill:empty { display: none; }
        .q-index { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .card-head-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .ghost-btn {
            display: inline-flex; align-items: center; gap: 7px;
            height: 34px; padding: 0 13px;
            border: 1px solid var(--line-2); border-radius: 10px;
            background: #fff; color: var(--ink-2);
            font-family: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: border-color .16s ease, color .16s ease, background .16s ease;
        }
        .ghost-btn:hover { border-color: #c7cbf5; color: var(--brand); background: #fafbff; }
        .ghost-btn svg { width: 15px; height: 15px; stroke: currentColor; }
        .ghost-btn .muted { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
        .jump { display: flex; align-items: center; gap: 6px; }
        .jump input {
            width: 68px; height: 34px; padding: 0 10px;
            border: 1px solid var(--line-2); border-radius: 10px;
            font-family: inherit; font-size: 13px; color: var(--ink);
            outline: none; background: #fff;
            transition: border-color .16s ease, box-shadow .16s ease;
            -moz-appearance: textfield;
        }
        .jump input::-webkit-outer-spin-button,
        .jump input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .jump input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
        .jump button {
            height: 34px; padding: 0 12px; border: none; border-radius: 10px;
            background: #f3f4f8; color: var(--ink-2);
            font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background .16s ease;
        }
        .jump button:hover { background: #e9ebf3; }

        /* 错题重练提示条 */
        .mode-banner {
            display: none; align-items: center; gap: 9px;
            padding: 11px 14px; margin-bottom: 20px;
            border: 1px solid #fde68a; border-radius: 12px;
            background: #fffbeb; color: #b45309;
            font-size: 13px; font-weight: 600;
        }
        .mode-banner.show { display: flex; }
        .mode-banner .mode-dot {
            width: 7px; height: 7px; flex: none; border-radius: 50%;
            background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.16);
        }
        .mode-banner .mode-name { font-weight: 650; }
        .mode-banner .mode-progress {
            margin-left: auto; font-weight: 500; font-size: 12.5px;
            color: #a16207; font-variant-numeric: tabular-nums;
        }

        /* 题干 */
        .question-content {
            font-size: 19px; line-height: 1.85; letter-spacing: .1px;
            color: #1f2937; margin-bottom: 26px;
            white-space: pre-wrap; word-break: break-word;
        }
        .question-content pre {
            white-space: pre-wrap;
            font-family: ui-monospace, Consolas, 'Courier New', monospace;
            background: #f8f9fc; border: 1px solid var(--line);
            padding: 14px 16px; border-radius: 12px;
            font-size: 14.5px; line-height: 1.7; margin: 12px 0;
        }
        .question-content table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 15px; }
        .question-content table th,
        .question-content table td { border: 1px solid var(--line-2); padding: 10px 14px; text-align: left; }
        .question-content table th { background: #f8f9fc; font-weight: 650; }
        .question-content img { max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }

        .question-images { margin-bottom: 22px; }
        .question-images-toggle {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--ink-3); cursor: pointer; user-select: none;
        }
        .question-images-toggle input { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; }
        .question-images-list { margin-top: 12px; }
        .question-images-list img {
            max-width: 100%; height: auto; display: block;
            border: 1px solid var(--line); border-radius: 12px; margin: 8px 0;
        }

        /* 判断题 */
        .judge-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .judge-option {
            padding: 22px 16px;
            border: 1px solid var(--line-2); border-radius: 14px;
            background: #fff; cursor: pointer; text-align: center;
            font-size: 16.5px; font-weight: 650; color: var(--ink-2);
            transition: border-color .15s ease, background .15s ease, color .15s ease, transform .15s ease;
        }
        .judge-option:hover:not(.disabled) { border-color: #c7cbf5; background: #fafbff; color: var(--brand); transform: translateY(-1px); }
        .judge-option.selected { border-color: var(--brand); background: #f4f5ff; color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.08); }
        .judge-option.correct { border-color: var(--ok-line); background: var(--ok-bg); color: #15803d; }
        .judge-option.wrong { border-color: var(--bad-line); background: var(--bad-bg); color: #b91c1c; }
        .judge-option.disabled { pointer-events: none; }
        .judge-option.disabled:not(.correct):not(.wrong) { opacity: .55; }

        /* 选择题 */
        .options { display: grid; gap: 11px; }
        .option {
            display: flex; align-items: flex-start; gap: 13px;
            padding: 14px 16px;
            border: 1px solid var(--line-2); border-radius: 14px;
            background: #fff; cursor: pointer;
            transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
        }
        .option:hover:not(.disabled) { border-color: #c7cbf5; background: #fafbff; }
        .option.selected { border-color: var(--brand); background: #f4f5ff; box-shadow: 0 0 0 3px rgba(79,70,229,.08); }
        .option.correct { border-color: var(--ok-line); background: var(--ok-bg); }
        .option.wrong { border-color: var(--bad-line); background: var(--bad-bg); }
        .option.disabled { pointer-events: none; }
        .option.disabled:not(.correct):not(.wrong) { opacity: .55; }
        .option-letter {
            width: 27px; height: 27px; flex: 0 0 27px;
            border-radius: 9px; background: #f3f4f8;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 650; color: var(--ink-3);
            margin-top: 1px;
            transition: background .15s ease, color .15s ease;
        }
        .option.selected .option-letter { background: var(--brand); color: #fff; }
        .option.correct .option-letter { background: var(--ok); color: #fff; }
        .option.wrong .option-letter { background: var(--bad); color: #fff; }
        .option-content { font-size: 15.5px; line-height: 1.7; color: #1f2937; padding-top: 2px; word-break: break-word; }

        /* 填空题 / 简答题 */
        .fill-input {
            width: 100%; height: 52px; padding: 0 16px;
            border: 1px solid var(--line-2); border-radius: 13px;
            font-family: inherit; font-size: 16px; color: var(--ink);
            outline: none; background: #fff;
            transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
        }
        .fill-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
        .fill-input.correct { border-color: var(--ok-line); background: var(--ok-bg); color: #15803d; }
        .fill-input.wrong { border-color: var(--bad-line); background: var(--bad-bg); color: #b91c1c; }
        .essay-textarea {
            width: 100%; min-height: 180px; padding: 14px 16px;
            border: 1px solid var(--line-2); border-radius: 13px;
            font-family: inherit; font-size: 15.5px; line-height: 1.7; color: var(--ink);
            resize: vertical; outline: none; background: #fff;
            transition: border-color .16s ease, box-shadow .16s ease;
        }
        .essay-textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }

        .submit-btn {
            height: 48px; padding: 0 26px;
            border: none; border-radius: 13px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: #fff; font-family: inherit; font-size: 15px; font-weight: 600;
            cursor: pointer; box-shadow: 0 6px 16px rgba(79,70,229,.22);
            transition: transform .16s ease, box-shadow .16s ease;
        }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(79,70,229,.28); }
        .submit-btn:active { transform: translateY(0); }

        /* 答题反馈 */
        .feedback {
            display: none; margin-top: 24px; padding: 18px 20px;
            border: 1px solid var(--line); border-radius: 14px;
            background: #fafbfd;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: var(--ok-bg); border-color: var(--ok-line); }
        .feedback.wrong { background: var(--bad-bg); border-color: var(--bad-line); }
        .feedback-title { font-size: 15px; font-weight: 650; line-height: 1.5; }
        .feedback.correct .feedback-title { color: #15803d; }
        .feedback.wrong .feedback-title { color: #b91c1c; }
        .feedback-analysis {
            margin-top: 9px; padding-left: 12px;
            border-left: 2px solid rgba(17,24,39,.08);
            font-size: 14px; line-height: 1.8; color: var(--ink-2);
        }
        .feedback-analysis:empty { display: none; }
        .retry-btn {
            display: none; margin-top: 14px;
            height: 38px; padding: 0 18px;
            border: 1px solid #d6d9fb; border-radius: 10px;
            background: #fff; color: var(--brand);
            font-family: inherit; font-size: 13.5px; font-weight: 600;
            cursor: pointer; transition: background .16s ease;
        }
        .retry-btn.show { display: inline-flex; align-items: center; }
        .retry-btn:hover { background: #f4f5ff; }
        .mastered-tip {
            display: none; margin-top: 12px;
            font-size: 13px; font-weight: 600; color: #15803d;
        }
        .mastered-tip.show { display: block; }

        /* 底部导航 */
        .button-group { display: flex; gap: 12px; margin-top: 26px; }
        .nav-btn {
            display: none; height: 50px; padding: 0 24px;
            border: 1px solid transparent; border-radius: 13px;
            font-family: inherit; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
        }
        .nav-btn.show { display: inline-flex; align-items: center; justify-content: center; }
        .nav-btn.secondary { background: #fff; border-color: var(--line-2); color: var(--ink-2); }
        .nav-btn.secondary:hover { border-color: #c7cbf5; color: var(--brand); background: #fafbff; }
        .nav-btn.primary {
            margin-left: auto; min-width: 160px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: #fff; box-shadow: 0 6px 16px rgba(79,70,229,.22);
        }
        .nav-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(79,70,229,.28); }

        /* 结算页 */
        .completion { text-align: center; padding: 52px 34px 44px; }
        .completion-icon {
            width: 64px; height: 64px; margin: 0 auto 22px;
            border-radius: 22px;
            background: linear-gradient(140deg, var(--brand), var(--brand-2));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 24px rgba(79,70,229,.28);
        }
        .completion-icon svg { width: 32px; height: 32px; stroke: #fff; }
        .completion-title { font-size: 22px; font-weight: 650; color: var(--ink); margin-bottom: 8px; }
        .completion-score { font-size: 14px; color: var(--muted); margin-bottom: 28px; font-variant-numeric: tabular-nums; }
        .completion-stats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            max-width: 460px; margin: 0 auto 32px;
        }
        .stat-item { padding: 18px 10px; border: 1px solid var(--line); border-radius: 16px; background: #fbfbfe; }
        .stat-value { font-size: 26px; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--ink); }
        .stat-value.brand { color: var(--brand); }
        .stat-value.ok { color: var(--ok); }
        .stat-value.bad { color: var(--bad); }
        .stat-label { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            height: 48px; padding: 0 26px;
            border: 1px solid var(--line-2); border-radius: 13px;
            background: #fff; color: var(--ink-2);
            font-family: inherit; font-size: 14.5px; font-weight: 600;
            text-decoration: none; cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, color .16s ease, background .16s ease;
        }
        .btn:hover { border-color: #c7cbf5; color: var(--brand); background: #fafbff; }
        .btn-primary {
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            border-color: transparent; color: #fff;
            box-shadow: 0 6px 16px rgba(79,70,229,.22);
        }
        .btn-primary:hover { color: #fff; transform: translateY(-1px); box-shadow: 0 10px 22px rgba(79,70,229,.28); }

        /* 载入 */
        .loading-box { padding: 80px 0; text-align: center; }
        .spinner {
            width: 34px; height: 34px; margin: 0 auto;
            border: 3px solid #eceef3; border-top-color: var(--brand);
            border-radius: 50%; animation: spin .9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 14px; font-size: 13.5px; color: var(--muted); }

        /* ============ 答题卡抽屉 ============ */
        .sheet-mask {
            position: fixed; inset: 0; z-index: 90;
            background: rgba(17,24,39,.36);
            backdrop-filter: blur(2px);
            opacity: 0; visibility: hidden;
            transition: opacity .25s ease;
        }
        .sheet-mask.show { opacity: 1; visibility: visible; }
        .sheet-panel {
            position: fixed; top: 0; right: 0; z-index: 91;
            width: 440px; max-width: 100vw; height: 100%;
            display: flex; flex-direction: column;
            background: #fff; border-radius: 20px 0 0 20px;
            box-shadow: -20px 0 50px rgba(17,24,39,.14);
            transform: translateX(105%);
            transition: transform .3s cubic-bezier(.4,0,.2,1);
        }
        .sheet-panel.show { transform: translateX(0); }
        .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 22px 22px 12px; }
        .sheet-title { font-size: 17px; font-weight: 650; color: var(--ink); }
        .sheet-sub { margin-top: 5px; font-size: 12.5px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
        .sheet-close {
            width: 32px; height: 32px; flex: none;
            border: none; border-radius: 10px;
            background: #f3f4f8; color: var(--ink-3);
            font-size: 18px; line-height: 1; cursor: pointer;
            transition: background .16s ease, color .16s ease;
        }
        .sheet-close:hover { background: #e9ebf3; color: var(--ink); }
        .sheet-tabs { display: flex; gap: 8px; padding: 0 22px 12px; flex-wrap: wrap; }
        .sheet-tab {
            height: 30px; padding: 0 13px;
            border: 1px solid var(--line-2); border-radius: 9px;
            background: #fff; color: var(--ink-3);
            font-family: inherit; font-size: 12.5px; font-weight: 600;
            cursor: pointer; font-variant-numeric: tabular-nums;
            transition: border-color .16s ease, color .16s ease, background .16s ease;
        }
        .sheet-tab:hover { border-color: #c7cbf5; color: var(--brand); }
        .sheet-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
        .sheet-legend { display: flex; gap: 14px; padding: 0 22px 12px; font-size: 11.5px; color: var(--muted); }
        .sheet-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
        .sheet-grid {
            flex: 1; overflow-y: auto; padding: 4px 22px 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
            gap: 9px; align-content: start;
        }
        .sheet-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 13.5px; padding: 60px 0; }
        .question-dot {
            height: 44px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--line-2); border-radius: 10px;
            background: #fff; color: var(--ink-3);
            font-family: inherit; font-size: 13.5px; font-weight: 600;
            font-variant-numeric: tabular-nums;
            cursor: pointer; transition: border-color .14s ease, color .14s ease, background .14s ease;
        }
        .question-dot:hover { border-color: #c7cbf5; color: var(--brand); background: #fafbff; }
        .question-dot.correct { background: var(--ok-bg); border-color: var(--ok-line); color: #15803d; }
        .question-dot.wrong { background: var(--bad-bg); border-color: var(--bad-line); color: #b91c1c; }
        .question-dot.current { border-color: var(--brand); color: var(--brand); font-weight: 700; box-shadow: 0 0 0 2px rgba(79,70,229,.18); }
        .sheet-pager {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 14px 22px; border-top: 1px solid var(--line);
            font-size: 12.5px; color: var(--muted); flex-wrap: wrap;
            font-variant-numeric: tabular-nums;
        }
        .sheet-pager .pager-btns { display: flex; align-items: center; gap: 8px; }
        .sheet-pager button {
            height: 30px; padding: 0 11px;
            border: 1px solid var(--line-2); border-radius: 9px;
            background: #fff; color: var(--ink-2);
            font-family: inherit; font-size: 12.5px; cursor: pointer;
            transition: border-color .16s ease, color .16s ease;
        }
        .sheet-pager button:hover:not(:disabled) { border-color: #c7cbf5; color: var(--brand); }
        .sheet-pager button:disabled { opacity: .4; cursor: not-allowed; }

        @media (max-width: 560px) {
            .topbar-inner { padding: 10px 14px; gap: 10px; }
            .topbar-title { font-size: 14.5px; }
            .topbar-stats { font-size: 11.5px; gap: 5px; }
            .icon-btn { width: 34px; height: 34px; border-radius: 10px; }
            .icon-btn svg { width: 17px; height: 17px; }
            .pill-btn { height: 34px; padding: 0 11px; font-size: 12.5px; border-radius: 10px; }
            .stage { padding: 16px 12px 48px; }
            .card { padding: 20px 16px 18px; border-radius: 18px; }
            .card-head { gap: 8px; margin-bottom: 16px; padding-bottom: 13px; }
            .jump { display: none; }
            .ghost-btn { height: 32px; font-size: 12.5px; padding: 0 11px; }
            .question-content { font-size: 16.5px; line-height: 1.8; margin-bottom: 20px; }
            .option { padding: 12px 13px; gap: 11px; }
            .option-content { font-size: 14.5px; }
            .judge-option { padding: 18px 12px; font-size: 15px; }
            .feedback { padding: 15px 16px; }
            .button-group { margin-top: 20px; gap: 10px; }
            .nav-btn { height: 46px; font-size: 14px; padding: 0 16px; }
            .nav-btn.primary { min-width: 0; flex: 1; }
            .completion { padding: 40px 16px 34px; }
            .completion-stats { gap: 9px; }
            .stat-value { font-size: 21px; }
            .sheet-panel { width: 100%; border-radius: 0; }
            .sheet-grid { grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; padding: 4px 16px 16px; }
            .sheet-head { padding: 18px 16px 10px; }
            .sheet-tabs { padding: 0 16px 10px; }
            .sheet-legend { padding: 0 16px 10px; }
            .sheet-pager { padding: 12px 16px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="icon-btn" href="index.html" title="返回首页" aria-label="返回首页">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </a>
            <div class="topbar-meta">
                <div class="topbar-line">
                    <span class="topbar-title">刷题练习</span>
                    <span class="mode-tag" id="topModeTag">全部题目</span>
                </div>
                <div class="topbar-stats">
                    <span><b id="current">0</b> / <span id="total">0</span></span>
                    <span class="sep">·</span>
                    <span>已答 <b id="answered">0</b></span>
                    <span class="sep">·</span>
                    <span id="wrongStatBox">错题 <b id="wrongTotal">0</b></span>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="pill-btn" id="wrongModeBtn" onclick="toggleWrongMode()">错题重练</button>
                <button class="icon-btn danger" onclick="clearProgress()" title="清除进度" aria-label="清除进度">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"/><path d="M8 6V4h8v2"/>
                        <path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="progress-rail"><i id="progressBar"></i></div>
    </header>

    <main class="stage">
        <div class="loading-box" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">加载题目中…</div>
        </div>

        <section class="card" id="questionContainer" style="display: none;">
            <div class="card-head">
                <span class="type-pill" id="questionType"></span>
                <span class="q-index" id="questionNumber">第 1 题</span>
                <div class="card-head-right">
                    <button class="ghost-btn" onclick="openSheet()">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                            <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
                        </svg>
                        答题卡
                        <span class="muted" id="sheetCount">0/0</span>
                    </button>
                    <div class="jump">
                        <input type="number" id="jumpInput" min="1" placeholder="题号"
                               onkeypress="if(event.key==='Enter'){jumpTo();}">
                        <button onclick="jumpTo()">跳转</button>
                    </div>
                </div>
            </div>

            <div class="mode-banner" id="modeBanner">
                <span class="mode-dot"></span>
                <span class="mode-name" id="modeName">错题重练</span>
                <span class="mode-progress" id="modeProgress">已重练 0 · 已答对 0</span>
            </div>

            <div class="question-content" id="questionContent"></div>

            <div class="question-images" id="questionImages" style="display: none;">
                <label class="question-images-toggle">
                    <input type="checkbox" id="imagesToggle" checked onchange="toggleQuestionImages()">
                    显示题目图片（PDF 原图）
                </label>
                <div class="question-images-list" id="questionImagesList"></div>
            </div>

            <!-- 判断题 -->
            <div class="judge-options" id="judgeOptions" style="display: none;">
                <div class="judge-option" data-answer="对" onclick="selectJudgeOption('对')">√ 对</div>
                <div class="judge-option" data-answer="错" onclick="selectJudgeOption('错')">× 错</div>
            </div>

            <!-- 选择题（由 JS 按题目实际选项渲染，支持 A-G） -->
            <div class="options" id="selectOptions" style="display: none;"></div>

            <!-- 填空题 -->
            <div id="fillContainer" style="display: none;">
                <input type="text" class="fill-input" id="fillInput" placeholder="请输入答案…" onkeypress="handleFillKeyPress(event)">
                <button class="submit-btn" onclick="submitFillAnswer()" style="margin-top: 14px;">提交答案</button>
            </div>

            <!-- 简答题 -->
            <div id="essayContainer" style="display: none;">
                <textarea class="essay-textarea" id="essayTextarea" placeholder="请输入你的答案…"></textarea>
                <button class="submit-btn" onclick="submitEssayAnswer()" style="margin-top: 14px;">提交答案</button>
            </div>

            <!-- 多选题确认 -->
            <div id="confirmBtnContainer" style="display: none; margin-top: 18px;">
                <button class="submit-btn" onclick="confirmMultipleAnswer()">确认答案</button>
            </div>

            <div class="feedback" id="feedback">
                <div class="feedback-title" id="feedbackTitle"></div>
                <div class="feedback-analysis" id="feedbackAnalysis"></div>
                <button class="retry-btn" id="retryBtn" onclick="retryCurrent()">↺ 再试一次</button>
                <div class="mastered-tip" id="masteredTip">✓ 已掌握，本题将从错题集移除</div>
            </div>

            <div class="button-group">
                <button class="nav-btn secondary" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
                <button class="nav-btn primary" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
            </div>
        </section>

        <section class="card completion" id="completion" style="display: none;">
            <div class="completion-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6L9 17l-5-5"/>
                </svg>
            </div>
            <div class="completion-title">恭喜完成！</div>
            <div class="completion-score">答对 <span id="correctCount">0</span> / <span id="totalCount">0</span> 题</div>
            <div class="completion-stats">
                <div class="stat-item">
                    <div class="stat-value brand" id="accuracy">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value ok" id="correctNum">0</div>
                    <div class="stat-label">答对</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value bad" id="wrongNum">0</div>
                    <div class="stat-label">答错</div>
                </div>
            </div>
            <button class="btn" id="backToAllBtn" onclick="exitWrongMode()" style="display: none; margin: 0 6px 0 0;">返回全部题目</button>
            <a href="index.html" class="btn btn-primary" style="margin: 0;">返回首页</a>
        </section>
    </main>

    <!-- 答题卡抽屉：题号按 50 个一页展示，支持筛选未答/错题 -->
    <div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
    <aside class="sheet-panel" id="sheetPanel" aria-hidden="true">
        <div class="sheet-head">
            <div>
                <div class="sheet-title">答题卡</div>
                <div class="sheet-sub" id="sheetSub"></div>
            </div>
            <button class="sheet-close" onclick="closeSheet()" title="关闭">×</button>
        </div>
        <div class="sheet-tabs">
            <button class="sheet-tab active" data-filter="all" onclick="setSheetFilter('all')" id="tabAll">全部</button>
            <button class="sheet-tab" data-filter="unanswered" onclick="setSheetFilter('unanswered')" id="tabUnanswered">未答</button>
            <button class="sheet-tab" data-filter="wrong" onclick="setSheetFilter('wrong')" id="tabWrong">错题</button>
        </div>
        <div class="sheet-legend">
            <span><i style="background:#d1fadf;"></i>答对</span>
            <span><i style="background:#fecaca;"></i>答错</span>
            <span><i style="background:#fff;border:1px solid #e5e7f0;"></i>未答</span>
            <span><i style="background:#fff;border:2px solid #4f46e5;"></i>当前</span>
        </div>
        <div class="sheet-grid" id="sheetGrid"></div>
        <div class="sheet-pager">
            <span id="pageInfo">共 0 条</span>
            <div class="pager-btns">
                <button id="pagePrev" onclick="changeSheetPage(-1)">上一页</button>
                <span id="pageIdx">1 / 1</span>
                <button id="pageNext" onclick="changeSheetPage(1)">下一页</button>
            </div>
        </div>
    </aside>

    <script>
        // 同源部署：页面与接口在同一个 Spring Boot 服务下，跟随实际主机/端口
        const API_BASE = '';

        let questions = [];        // 全量题库
        let queue = [];            // 当前练习队列（全部题目 / 错题快照）
        let currentIndex = 0;
        let selectedAnswer = null;
        let selectedAnswers = new Set(); // 用于多选题存储多个选项
        let isAnswered = false;
        let progress = {};         // 全量答题记录：{questionId: {userAnswer, isCorrect}}
        let autoJumpTimer = null; // 自动跳转定时器

        // 错题重练：mode='wrong' 时只在 queue（错题快照）里练，
        // 本次作答单独记在 sessionRecords，不回显旧答案；答对即写回 progress（后端已覆盖）
        let mode = 'all';          // all | wrong
        let sessionRecords = {};   // 错题重练会话：{questionId: {userAnswer, isCorrect}}
        let allIndexBackup = 0;    // 从全部模式进入错题模式时记住的位置

        // 答题卡状态：分页展示，避免几百个题号一次铺满页面
        const SHEET_PAGE_SIZE = 50;
        let sheetFilter = 'all';      // all | unanswered | wrong
        let sheetPage = 0;
        let sheetList = [];           // 当前筛选下的题目下标
        let sheetOpen = false;

        function init() {
            Promise.all([
                fetch(`${API_BASE}/api/questions`).then(res => res.json()),
                fetch(`${API_BASE}/api/answers/progress`).then(res => res.json())
            ]).then(([questionData, progressData]) => {
                questions = questionData;
                queue = questions;             // 默认刷全部题目
                progress = progressData.progress || {};
                
                document.getElementById('total').textContent = queue.length;
                document.getElementById('answered').textContent = progressData.answered || 0;
                refreshWrongTotal();
                
                if (questions.length === 0) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('completion').style.display = 'block';
                    document.getElementById('totalCount').textContent = 0;
                    return;
                }
                
                // 答题卡只在真正打开时才渲染，首屏不为 700+ 题号付出任何 DOM 开销
                updateSheetCounts();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('questionContainer').style.display = 'block';

                // 支持从首页直接进入错题重练：practice.html?mode=wrong
                const params = new URLSearchParams(location.search);
                if (params.get('mode') === 'wrong') {
                    enterWrongMode();
                    if (mode === 'wrong') return;
                }
                
                let startIndex = 0;
                for (let i = 0; i < questions.length; i++) {
                    if (!progress[questions[i].id]) {
                        startIndex = i;
                        break;
                    }
                }
                loadQuestion(startIndex);
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = '<div style="text-align:center;color:#dc3545;">加载失败，请检查网络连接</div>';
                console.error(err);
            });
        }

        // ============ 错题重练 ============
        // 当前题目的作答记录：全部模式取服务端进度，错题模式取本次会话（不回显旧答案）
        function recordOf(index) {
            const question = queue[index];
            if (!question) return null;
            if (mode === 'wrong') return sessionRecords[question.id] || null;
            return progress[question.id] || null;
        }

        function wrongCount() {
            return questions.filter(q => {
                const r = progress[q.id];
                return r && r.isCorrect !== 1;
            }).length;
        }

        function refreshWrongTotal() {
            const n = wrongCount();
            document.getElementById('wrongTotal').textContent = n;
            const btn = document.getElementById('wrongModeBtn');
            if (mode !== 'wrong') {
                btn.textContent = n > 0 ? `错题重练 ${n}` : '错题重练';
            }
        }

        // 顶部细进度条：已答 / 队列总数
        function setProgressBar(stats) {
            const bar = document.getElementById('progressBar');
            if (!bar) return;
            const pct = queue.length ? Math.round((stats.answered / queue.length) * 100) : 0;
            bar.style.width = pct + '%';
        }

        // 顶部模式标签
        function setModeTag(isWrong) {
            const tag = document.getElementById('topModeTag');
            if (!tag) return;
            tag.textContent = isWrong ? '错题重练' : '全部题目';
            tag.classList.toggle('wrong', !!isWrong);
        }

        function updateQueueHeader() {
            const stats = computeStats();
            document.getElementById('total').textContent = queue.length;
            document.getElementById('answered').textContent = stats.answered;
            setProgressBar(stats);
            if (mode === 'wrong') {
                document.getElementById('modeName').textContent = `共 ${queue.length} 题`;
                document.getElementById('modeProgress').textContent =
                    `已重练 ${stats.answered} · 已答对 ${stats.correct}`;
            }
        }

        function toggleWrongMode() {
            if (mode === 'wrong') {
                exitWrongMode();
            } else {
                enterWrongMode();
            }
        }

        function enterWrongMode() {
            const wrongList = questions.filter(q => {
                const r = progress[q.id];
                return r && r.isCorrect !== 1;
            });
            if (!wrongList.length) {
                alert('暂时没有错题，继续刷题吧 👍');
                if (mode === 'wrong') exitWrongMode();
                return;
            }
            if (mode !== 'wrong') allIndexBackup = currentIndex;
            mode = 'wrong';
            queue = wrongList;
            sessionRecords = {};
            currentIndex = 0;
            clearAutoJump();

            document.getElementById('completion').style.display = 'none';
            document.getElementById('questionContainer').style.display = 'block';
            document.getElementById('modeBanner').classList.add('show');
            document.getElementById('wrongModeBtn').textContent = '← 返回全部题目';
            document.getElementById('wrongModeBtn').classList.add('active');
            document.getElementById('wrongStatBox').style.display = 'none';
            setModeTag(true);
            updateQueueHeader();
            loadQuestion(0);
            if (sheetOpen) renderSheet();
        }

        function exitWrongMode() {
            mode = 'all';
            queue = questions;
            sessionRecords = {};
            currentIndex = Math.max(0, Math.min(allIndexBackup, queue.length - 1));
            clearAutoJump();

            document.getElementById('modeBanner').classList.remove('show');
            document.getElementById('wrongModeBtn').textContent = '错题重练';
            document.getElementById('wrongModeBtn').classList.remove('active');
            document.getElementById('wrongStatBox').style.display = '';
            setModeTag(false);
            document.getElementById('completion').style.display = 'none';
            document.getElementById('questionContainer').style.display = 'block';
            refreshWrongTotal();
            updateQueueHeader();
            loadQuestion(currentIndex);
            if (sheetOpen) renderSheet();
        }

        function clearAutoJump() {
            if (autoJumpTimer) {
                clearTimeout(autoJumpTimer);
                autoJumpTimer = null;
            }
        }

        // 队列是否已全部作答
        function allAnsweredInQueue() {
            return queue.length > 0 && queue.every(q => {
                const r = mode === 'wrong' ? sessionRecords[q.id] : progress[q.id];
                return !!r;
            });
        }

        function firstUnansweredInQueue() {
            return queue.findIndex(q => {
                const r = mode === 'wrong' ? sessionRecords[q.id] : progress[q.id];
                return !r;
            });
        }

        // ============ 答题卡 ============
        function statusOf(index) {
            const record = recordOf(index);
            if (!record) return 'unanswered';
            return record.isCorrect === 1 ? 'correct' : 'wrong';
        }

        function computeStats() {
            let answered = 0;
            let wrong = 0;
            queue.forEach(q => {
                const record = mode === 'wrong' ? sessionRecords[q.id] : progress[q.id];
                if (!record) return;
                answered++;
                if (record.isCorrect !== 1) wrong++;
            });
            return { answered, wrong, correct: answered - wrong, unanswered: queue.length - answered };
        }

        // 刷新计数（题量大时每次答题只需更新这几个文字，不动 DOM 列表）
        function updateSheetCounts() {
            const stats = computeStats();
            document.getElementById('sheetCount').textContent = `${stats.answered}/${queue.length}`;
            document.getElementById('sheetSub').textContent =
                `共 ${queue.length} 题 · 已答 ${stats.answered} · 答对 ${stats.correct} · 错题 ${stats.wrong}`;
            document.getElementById('tabAll').textContent = `全部 ${queue.length}`;
            document.getElementById('tabUnanswered').textContent = `未答 ${stats.unanswered}`;
            document.getElementById('tabWrong').textContent = `错题 ${stats.wrong}`;
            document.getElementById('answered').textContent = stats.answered;
            setProgressBar(stats);
            if (mode === 'wrong') {
                document.getElementById('modeProgress').textContent =
                    `已重练 ${stats.answered} · 已答对 ${stats.correct}`;
            }
        }

        function buildSheetList() {
            sheetList = [];
            for (let i = 0; i < queue.length; i++) {
                const status = statusOf(i);
                if (sheetFilter === 'all'
                    || (sheetFilter === 'unanswered' && status === 'unanswered')
                    || (sheetFilter === 'wrong' && status === 'wrong')) {
                    sheetList.push(i);
                }
            }
        }

        // 只渲染当前这一页（最多 50 个），题量再大也不卡
        function renderSheet() {
            updateSheetCounts();
            buildSheetList();

            const pages = Math.max(1, Math.ceil(sheetList.length / SHEET_PAGE_SIZE));
            if (sheetPage > pages - 1) sheetPage = pages - 1;
            if (sheetPage < 0) sheetPage = 0;

            const start = sheetPage * SHEET_PAGE_SIZE;
            const slice = sheetList.slice(start, start + SHEET_PAGE_SIZE);
            const grid = document.getElementById('sheetGrid');
            grid.innerHTML = '';

            if (slice.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'sheet-empty';
                empty.textContent = sheetFilter === 'wrong'
                    ? '还没有错题，继续保持 👍'
                    : (sheetFilter === 'unanswered' ? '题目已全部答完 🎉' : '暂无题目');
                grid.appendChild(empty);
            } else {
                const frag = document.createDocumentFragment();
                slice.forEach(index => {
                    const dot = document.createElement('button');
                    dot.type = 'button';
                    dot.className = 'question-dot ' + statusOf(index);
                    dot.dataset.index = index;
                    dot.textContent = index + 1;
                    dot.title = `第 ${index + 1} 题`;
                    if (index === currentIndex) dot.classList.add('current');
                    dot.onclick = () => {
                        closeSheet();
                        loadQuestion(index);
                    };
                    frag.appendChild(dot);
                });
                grid.appendChild(frag);
            }

            document.getElementById('pageInfo').textContent = sheetList.length
                ? `第 ${start + 1}-${Math.min(start + SHEET_PAGE_SIZE, sheetList.length)} 题 / 共 ${sheetList.length} 条`
                : '共 0 条';
            document.getElementById('pageIdx').textContent = `${sheetPage + 1} / ${pages}`;
            document.getElementById('pagePrev').disabled = sheetPage <= 0;
            document.getElementById('pageNext').disabled = sheetPage >= pages - 1;
        }

        function setSheetFilter(filter) {
            sheetFilter = filter;
            sheetPage = 0;
            document.querySelectorAll('.sheet-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });
            // 切到某个筛选后，尽量定位到当前题所在页
            focusCurrentPage();
            renderSheet();
        }

        function focusCurrentPage() {
            buildSheetList();
            const pos = sheetList.indexOf(currentIndex);
            if (pos >= 0) sheetPage = Math.floor(pos / SHEET_PAGE_SIZE);
        }

        function changeSheetPage(delta) {
            sheetPage += delta;
            renderSheet();
            const grid = document.getElementById('sheetGrid');
            grid.scrollTop = 0;
        }

        function openSheet() {
            sheetOpen = true;
            focusCurrentPage();
            renderSheet();
            document.getElementById('sheetMask').classList.add('show');
            const panel = document.getElementById('sheetPanel');
            panel.classList.add('show');
            panel.setAttribute('aria-hidden', 'false');
        }

        function closeSheet() {
            sheetOpen = false;
            document.getElementById('sheetMask').classList.remove('show');
            const panel = document.getElementById('sheetPanel');
            panel.classList.remove('show');
            panel.setAttribute('aria-hidden', 'true');
        }

        // Esc 关闭答题卡
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && sheetOpen) closeSheet();
        });

        function jumpTo() {
            const input = document.getElementById('jumpInput');
            const num = parseInt(input.value, 10);
            if (!num || num < 1 || num > queue.length) {
                alert(`请输入 1 - ${queue.length} 之间的题号`);
                input.select();
                return;
            }
            input.value = '';
            closeSheet();
            loadQuestion(num - 1);
        }

        // 题型名称：直接放在胶囊标签里，不带书名号
        function getQuestionTypeName(type) {
            const typeMap = {
                'single': '单选题',
                'multiple': '多选题',
                'judge': '判断题',
                'fill': '填空题',
                'essay': '简答题'
            };
            return typeMap[type] || '单选题';
        }

        // 按题目实际选项渲染（支持 A-G，兼容只有 2~3 个选项的题）
        function renderOptions(question) {
            const container = document.getElementById('selectOptions');
            container.innerHTML = '';
            ['A', 'B', 'C', 'D', 'E', 'F', 'G'].forEach(letter => {
                const text = question['option' + letter];
                if (!text || !String(text).trim()) return;
                const div = document.createElement('div');
                div.className = 'option';
                div.dataset.answer = letter;
                const badge = document.createElement('span');
                badge.className = 'option-letter';
                badge.textContent = letter;
                const span = document.createElement('span');
                span.className = 'option-content';
                span.textContent = text;
                div.appendChild(badge);
                div.appendChild(span);
                div.onclick = () => selectOption(letter);
                container.appendChild(div);
            });
        }

        // 渲染 PDF 原图（填空题效果图），带显示开关
        function renderQuestionImages(question) {
            const box = document.getElementById('questionImages');
            const list = document.getElementById('questionImagesList');
            const urls = String(question.images || '').split(',').map(s => s.trim()).filter(Boolean);
            if (!urls.length) {
                box.style.display = 'none';
                list.innerHTML = '';
                return;
            }
            document.getElementById('imagesToggle').checked = true;
            list.innerHTML = urls.map(u =>
                `<img src="${u}" alt="题目图片" loading="lazy" onerror="this.style.display='none'">`
            ).join('');
            box.style.display = 'block';
        }

        function toggleQuestionImages() {
            const show = document.getElementById('imagesToggle').checked;
            document.getElementById('questionImagesList').style.display = show ? 'block' : 'none';
        }

        function loadQuestion(index) {
            if (index < 0 || index >= queue.length) return;

            // 清理定时器
            clearAutoJump();
            
            currentIndex = index;
            selectedAnswer = null;
            selectedAnswers.clear();
            isAnswered = false;

            const question = queue[index];
            document.getElementById('questionNumber').textContent = `第 ${index + 1} / ${queue.length} 题`;
            document.getElementById('current').textContent = index + 1;
            const content = question.content || '';
            const contentEl = document.getElementById('questionContent');
            // 仅本站上传的图片题按 HTML 渲染；其余一律转义显示，<img>、<body> 等标签按文字原样展示
            if (/<img\s[^>]*src=["']\/uploads\//.test(content)) {
                contentEl.innerHTML = content;
            } else {
                contentEl.textContent = content;
            }
            renderQuestionImages(question);
            document.getElementById('questionType').textContent = getQuestionTypeName(question.questionType);

            // 隐藏所有输入控件
            document.getElementById('judgeOptions').style.display = 'none';
            document.getElementById('selectOptions').style.display = 'none';
            document.getElementById('fillContainer').style.display = 'none';
            document.getElementById('essayContainer').style.display = 'none';
            document.getElementById('confirmBtnContainer').style.display = 'none';
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('retryBtn').classList.remove('show');
            document.getElementById('masteredTip').classList.remove('show');

            // 根据题型显示对应的输入控件
            const questionType = question.questionType;
            
            if (questionType === 'judge') {
                // 判断题
                document.getElementById('judgeOptions').style.display = 'flex';
                document.querySelectorAll('.judge-option').forEach(opt => {
                    opt.classList.remove('selected', 'correct', 'wrong', 'disabled');
                });
            } else if (questionType === 'single' || questionType === 'multiple') {
                // 选择题
                document.getElementById('selectOptions').style.display = 'grid';
                renderOptions(question);
                // 如果是多选题，显示确认答案按钮
                if (questionType === 'multiple') {
                    document.getElementById('confirmBtnContainer').style.display = 'block';
                }
            } else if (questionType === 'fill') {
                // 填空题
                document.getElementById('fillContainer').style.display = 'block';
                const fillInput = document.getElementById('fillInput');
                fillInput.value = '';
                fillInput.classList.remove('correct', 'wrong');
            } else if (questionType === 'essay') {
                // 简答题
                document.getElementById('essayContainer').style.display = 'block';
                document.getElementById('essayTextarea').value = '';
            }
            
            // 检查是否已作答（错题模式下只看本次会话，旧答案不回显，才能重新做）
            const savedRecord = recordOf(index);
            if (savedRecord) {
                isAnswered = true;
                selectedAnswer = savedRecord.userAnswer;
                showSavedAnswer(questionType, savedRecord);
            }

            // 更新答题卡里的「当前题」标记：只改已渲染的那几个格子，不重建整张卡
            document.querySelectorAll('.question-dot').forEach(dot => {
                dot.classList.toggle('current', Number(dot.dataset.index) === index);
            });

            updateNavButtons();
        }

        function showSavedAnswer(questionType, record) {
            if (questionType === 'judge') {
                document.querySelectorAll('.judge-option').forEach(opt => {
                    opt.classList.add('disabled');
                    if (opt.dataset.answer === record.userAnswer) {
                        opt.classList.add(record.isCorrect === 1 ? 'correct' : 'wrong');
                    }
                });
            } else if (questionType === 'single' || questionType === 'multiple') {
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.add('disabled');
                });
                
                if (questionType === 'multiple') {
                    // 多选题处理：显示用户选择的所有选项和正确选项
                    const userAnswerSet = new Set(letterSet(record.userAnswer));
                    const correctAnswerSet = new Set(letterSet(queue[currentIndex].correctAnswer));
                    
                    document.querySelectorAll('.option').forEach(opt => {
                        const answer = opt.dataset.answer;
                        const isUserSelected = userAnswerSet.has(answer);
                        const isCorrect = correctAnswerSet.has(answer);
                        
                        if (isUserSelected) {
                            if (isCorrect) {
                                opt.classList.add('correct');
                            } else {
                                opt.classList.add('wrong');
                            }
                        }
                        if (isCorrect && !isUserSelected) {
                            // 漏选的正确选项也显示正确样式
                            opt.classList.add('correct');
                        }
                    });
                } else {
                    // 单选题处理
                    const selectedOpt = findOption(record.userAnswer);
                    const correctOpt = findOption(queue[currentIndex].correctAnswer);

                    if (record.isCorrect === 1) {
                        if (selectedOpt) selectedOpt.classList.add('correct');
                    } else {
                        if (selectedOpt) selectedOpt.classList.add('wrong');
                        if (correctOpt) correctOpt.classList.add('correct');
                    }
                }
            } else if (questionType === 'fill') {
                const fillInput = document.getElementById('fillInput');
                fillInput.value = record.userAnswer;
                fillInput.classList.add(record.isCorrect === 1 ? 'correct' : 'wrong');
            } else if (questionType === 'essay') {
                document.getElementById('essayTextarea').value = record.userAnswer;
            }
            
            showFeedback(record.isCorrect === 1, queue[currentIndex].correctAnswer, queue[currentIndex].analysis);
        }

        // 答案字母集合（容错：去空格、标点、忽略大小写）
        function letterSet(answer) {
            return String(answer || '').toUpperCase().replace(/[^A-G]/g, '').split('');
        }

        // 按答案字母找选项元素（容错：去空格、忽略大小写）
        function findOption(answer) {
            if (!answer) return null;
            const letter = String(answer).trim().toUpperCase().replace(/[^A-G]/g, '');
            if (letter.length !== 1) return null;
            return document.querySelector(`.option[data-answer="${letter}"]`);
        }

        function selectJudgeOption(answer) {
            if (isAnswered) return;

            document.querySelectorAll('.judge-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.querySelector(`.judge-option[data-answer="${answer}"]`).classList.add('selected');
            selectedAnswer = answer;

            submitAnswer();
        }

        function selectOption(answer) {
            if (isAnswered) return;

            const questionType = queue[currentIndex].questionType;
            if (questionType === 'multiple') {
                // 多选题：切换选中状态
                const opt = document.querySelector(`.option[data-answer="${answer}"]`);
                if (selectedAnswers.has(answer)) {
                    selectedAnswers.delete(answer);
                    opt.classList.remove('selected');
                } else {
                    selectedAnswers.add(answer);
                    opt.classList.add('selected');
                }
            } else {
                // 单选题：只能选一个，立即提交
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                document.querySelector(`.option[data-answer="${answer}"]`).classList.add('selected');
                selectedAnswer = answer;
                submitAnswer();
            }
        }

        // 确认多选题答案
        function confirmMultipleAnswer() {
            if (isAnswered) return;
            if (selectedAnswers.size === 0) {
                alert('请至少选择一个选项');
                return;
            }
            
            // 将选中的选项排序后拼接成字符串（如ABC、AC等）
            selectedAnswer = Array.from(selectedAnswers).sort().join('');
            submitAnswer();
        }

        function handleFillKeyPress(event) {
            if (event.key === 'Enter') {
                submitFillAnswer();
            }
        }

        function submitFillAnswer() {
            const userAnswer = document.getElementById('fillInput').value.trim();
            if (!userAnswer) {
                alert('请输入答案');
                return;
            }
            
            if (isAnswered) return;
            selectedAnswer = userAnswer;
            
            submitAnswer();
        }

        function submitEssayAnswer() {
            const userAnswer = document.getElementById('essayTextarea').value.trim();
            if (!userAnswer) {
                alert('请输入答案');
                return;
            }
            
            if (isAnswered) return;
            selectedAnswer = userAnswer;
            
            submitAnswer();
        }

        function submitAnswer() {
            if (!selectedAnswer || isAnswered) return;

            fetch(`${API_BASE}/api/answers/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    questionId: queue[currentIndex].id,
                    userAnswer: selectedAnswer
                })
            })
            .then(res => res.json())
            .then(data => {
                const qid = queue[currentIndex].id;
                const record = { userAnswer: selectedAnswer, isCorrect: data.isCorrect ? 1 : 0 };
                // 全量进度始终同步（后端已覆盖写），退出错题模式后状态才对
                progress[qid] = record;
                // 错题重练：本次作答单独记账，页面靠它决定是否已答
                if (mode === 'wrong') sessionRecords[qid] = record;
                
                // 答题卡：只更新计数与状态，抽屉开着时才重绘当前页
                updateSheetCounts();
                if (sheetOpen) renderSheet();

                showResult(data.isCorrect, data.correctAnswer, data.analysis);
                refreshWrongTotal();
            })
            .catch(err => {
                console.log('提交答案失败:', err);
            });
        }

        function showResult(isCorrect, correctAnswer, analysis) {
            const questionType = queue[currentIndex].questionType;
            
            if (questionType === 'judge') {
                document.querySelectorAll('.judge-option').forEach(opt => {
                    opt.classList.add('disabled');
                    if (opt.dataset.answer === selectedAnswer) {
                        opt.classList.add(isCorrect ? 'correct' : 'wrong');
                    }
                });
            } else if (questionType === 'single' || questionType === 'multiple') {
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.add('disabled');
                });
                
                if (questionType === 'multiple') {
                    // 多选题处理：显示用户选择的所有选项和正确选项
                    const userAnswerSet = new Set(letterSet(selectedAnswer));
                    const correctAnswerSet = new Set(letterSet(correctAnswer));
                    
                    document.querySelectorAll('.option').forEach(opt => {
                        const answer = opt.dataset.answer;
                        const isUserSelected = userAnswerSet.has(answer);
                        const isCorrectOpt = correctAnswerSet.has(answer);
                        
                        if (isUserSelected) {
                            if (isCorrectOpt) {
                                opt.classList.add('correct');
                            } else {
                                opt.classList.add('wrong');
                            }
                        }
                        if (isCorrectOpt && !isUserSelected) {
                            // 漏选的正确选项也显示正确样式
                            opt.classList.add('correct');
                        }
                    });
                } else {
                    // 单选题处理
                    const selectedOpt = findOption(selectedAnswer);
                    const correctOpt = findOption(correctAnswer);

                    if (isCorrect) {
                        if (selectedOpt) selectedOpt.classList.add('correct');
                    } else {
                        if (selectedOpt) selectedOpt.classList.add('wrong');
                        if (correctOpt) correctOpt.classList.add('correct');
                    }
                }
            } else if (questionType === 'fill') {
                const fillInput = document.getElementById('fillInput');
                fillInput.classList.add(isCorrect ? 'correct' : 'wrong');
            }
            
            showFeedback(isCorrect, correctAnswer, analysis);
            updateNavButtons();

            // 错题重练：答错可以当场再试，答对则提示已从错题集移除
            if (mode === 'wrong') {
                document.getElementById('retryBtn').classList.toggle('show', !isCorrect);
                document.getElementById('masteredTip').classList.toggle('show', !!isCorrect);
            }

            // 答对后自动跳下一题，加快刷题节奏。
            // 全部模式：有解析的题不跳（来不及看解析）；错题重练：一律 1 秒后跳下一道，
            // 留出时间看清「已掌握」提示。
            const hasAnalysis = !!(analysis && String(analysis).trim());
            const autoJump = mode === 'wrong' ? true : !hasAnalysis;
            if (isCorrect && autoJump) {
                autoJumpTimer = setTimeout(() => {
                    if (currentIndex < queue.length - 1) {
                        loadQuestion(currentIndex + 1);
                    } else if (allAnsweredInQueue()) {
                        showCompletion();
                    } else {
                        const next = firstUnansweredInQueue();
                        if (next >= 0) loadQuestion(next);
                    }
                }, 1000);
            }
        }

        // 错题重练：答错后原地重做（清空本题会话记录与界面状态）
        function retryCurrent() {
            const question = queue[currentIndex];
            if (!question) return;
            delete sessionRecords[question.id];
            isAnswered = false;
            selectedAnswer = null;
            selectedAnswers.clear();

            document.querySelectorAll('.judge-option').forEach(opt => {
                opt.classList.remove('selected', 'correct', 'wrong', 'disabled');
            });
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected', 'correct', 'wrong', 'disabled');
            });
            const fillInput = document.getElementById('fillInput');
            fillInput.value = '';
            fillInput.classList.remove('correct', 'wrong');
            const essayInput = document.getElementById('essayTextarea');
            if (essayInput) essayInput.value = '';
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('retryBtn').classList.remove('show');
            document.getElementById('masteredTip').classList.remove('show');
            document.getElementById('confirmBtnContainer').style.display =
                question.questionType === 'multiple' ? 'block' : 'none';

            updateSheetCounts();
            if (sheetOpen) renderSheet();
            updateNavButtons();
        }

        function showFeedback(isCorrect, correctAnswer, analysis) {
            if (isCorrect) {
                document.getElementById('feedbackTitle').textContent = '✓ 回答正确！';
                document.getElementById('feedback').className = 'feedback correct show';
            } else {
                document.getElementById('feedbackTitle').textContent = `✗ 回答错误！正确答案是 ${correctAnswer}`;
                document.getElementById('feedback').className = 'feedback wrong show';
            }

            if (analysis) {
                document.getElementById('feedbackAnalysis').textContent = `解析：${analysis}`;
            } else {
                document.getElementById('feedbackAnalysis').textContent = '';
            }
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.classList.toggle('show', currentIndex > 0);
            nextBtn.classList.toggle('show', currentIndex < queue.length - 1 || isAnswered);
            
            if (currentIndex === queue.length - 1 && isAnswered) {
                nextBtn.textContent = '查看成绩';
            } else {
                nextBtn.textContent = '下一题 →';
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                loadQuestion(currentIndex - 1);
            }
        }

        function nextQuestion() {
            if (currentIndex === queue.length - 1 && allAnsweredInQueue()) {
                showCompletion();
            } else if (currentIndex < queue.length - 1) {
                loadQuestion(currentIndex + 1);
            } else {
                // 已是最后一题但还有未答题目：跳到第一道未答题，避免按钮点了没反应
                const nextUnanswered = firstUnansweredInQueue();
                if (nextUnanswered >= 0) {
                    loadQuestion(nextUnanswered);
                } else {
                    showCompletion();
                }
            }
        }

        function showCompletion() {
            document.getElementById('questionContainer').style.display = 'none';
            document.getElementById('completion').style.display = 'block';
            document.getElementById('backToAllBtn').style.display = mode === 'wrong' ? 'inline-flex' : 'none';

            const titleEl = document.querySelector('.completion-title');
            if (mode === 'wrong') {
                // 错题重练结算：只统计本次会话
                const records = queue.map(q => sessionRecords[q.id]).filter(Boolean);
                const correctNum = records.filter(r => r.isCorrect === 1).length;
                const wrongNum = records.length - correctNum;
                document.getElementById('correctCount').textContent = correctNum;
                document.getElementById('totalCount').textContent = queue.length;
                document.getElementById('correctNum').textContent = correctNum;
                document.getElementById('wrongNum').textContent = wrongNum;
                document.getElementById('accuracy').textContent =
                    (records.length ? Math.round((correctNum / records.length) * 100) : 0) + '%';
                if (titleEl) titleEl.textContent = '错题重练完成！';
                return;
            }

            if (titleEl) titleEl.textContent = '恭喜完成！';
            const correctNum = Object.values(progress).filter(r => r.isCorrect === 1).length;
            const answeredNum = Object.keys(progress).length;
            document.getElementById('correctCount').textContent = correctNum;
            document.getElementById('totalCount').textContent = questions.length;
            document.getElementById('correctNum').textContent = correctNum;
            // 「错误」只统计已作答且答错的题，未作答不应算错
            document.getElementById('wrongNum').textContent = Math.max(0, answeredNum - correctNum);

            const accuracy = answeredNum > 0 ? Math.round((correctNum / answeredNum) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function clearProgress() {
            if (confirm('确定要清除所有答题进度吗？')) {
                fetch(`${API_BASE}/api/answers/clear`, { method: 'DELETE' })
                    .then(() => {
                        progress = {};
                        sessionRecords = {};
                        // 清空后错题集也空了，退出错题模式回到全部题目
                        if (mode === 'wrong') exitWrongMode();
                        refreshWrongTotal();
                        updateSheetCounts();
                        if (sheetOpen) renderSheet();
                        loadQuestion(0);
                    })
                    .catch(err => console.error(err));
            }
        }

        init();
    </script>
</body>
</html>
