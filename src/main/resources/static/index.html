<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单人刷题软件</title>
    <style>
        :root {
            --ink: #111827;
            --ink-2: #4b5563;
            --muted: #9ca3af;
            --line: #eceef3;
            --brand: #4f46e5;
            --brand-2: #6366f1;
            --danger: #dc2626;
            --surface: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, Arial, sans-serif;
            background: #f7f8fc;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* 背景：两团极淡的光斑，替代原来的整屏紫色渐变 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }
        body::before { width: 460px; height: 460px; background: rgba(99,102,241,.16); top: -140px; left: -120px; }
        body::after  { width: 420px; height: 420px; background: rgba(236,72,153,.10); bottom: -160px; right: -120px; }

        .shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 660px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 48px 52px 36px;
            box-shadow: 0 1px 2px rgba(17,24,39,.04), 0 16px 40px rgba(17,24,39,.08);
        }

        /* 品牌区 */
        .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
        .logo {
            width: 54px; height: 54px; flex: none;
            border-radius: 16px;
            background: linear-gradient(140deg, var(--brand) 0%, var(--brand-2) 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 16px rgba(79,70,229,.28);
        }
        .logo svg { width: 28px; height: 28px; stroke: #fff; }
        .brand h1 { font-size: 24px; font-weight: 650; letter-spacing: .2px; line-height: 1.3; }
        .brand p { font-size: 14px; color: var(--muted); margin-top: 3px; }

        /* 数据卡 */
        .stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
            margin-bottom: 24px;
        }
        .stat {
            display: flex; align-items: center; gap: 15px;
            padding: 19px 20px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: linear-gradient(160deg, #fbfbff 0%, #ffffff 70%);
            transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
        }
        .stat:hover { border-color: #e2e4f6; box-shadow: 0 6px 18px rgba(17,24,39,.05); transform: translateY(-1px); }
        .stat-icon {
            width: 46px; height: 46px; flex: none;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: #eef0ff;
        }
        .stat-icon svg { width: 23px; height: 23px; stroke: var(--brand); }
        .stat.warn { background: linear-gradient(160deg, #fffbfb 0%, #ffffff 70%); }
        .stat.warn .stat-icon { background: #fdeeee; }
        .stat.warn .stat-icon svg { stroke: var(--danger); }
        /* 没有错题时整体转中性，不喧宾夺主 */
        .stat.warn.zero { background: linear-gradient(160deg, #fbfbfd 0%, #ffffff 70%); }
        .stat.warn.zero .stat-icon { background: #f2f3f6; }
        .stat.warn.zero .stat-icon svg { stroke: var(--muted); }
        .stat.warn.zero .num { color: var(--ink-2); }
        .stat-body { min-width: 0; }
        .stat .num {
            font-size: 32px; font-weight: 650; line-height: 1.1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.4px;
            color: var(--brand);
        }
        .stat.warn .num { color: var(--danger); }
        .stat .lbl {
            font-size: 12.5px; color: var(--muted);
            margin-top: 3px; letter-spacing: .2px;
            white-space: nowrap;
        }

        /* 主操作 */
        .cta {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; height: 62px; padding: 0 24px;
            border: none; border-radius: 16px; cursor: pointer;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff; font-family: inherit; font-size: 17.5px; font-weight: 600;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(79,70,229,.26);
            transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
            margin-bottom: 14px;
        }
        .cta:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(79,70,229,.32); filter: brightness(1.03); }
        .cta:active { transform: translateY(0); }
        .cta .left { display: flex; align-items: center; gap: 12px; }
        .cta svg { width: 20px; height: 20px; stroke: currentColor; }
        .cta .arrow { opacity: .8; }

        /* 次要操作 */
        .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .tile {
            display: flex; align-items: center; gap: 10px;
            padding: 18px 20px;
            border: 1px solid var(--line); border-radius: 16px;
            background: #fff; cursor: pointer; text-decoration: none;
            font-family: inherit; color: var(--ink-2); font-size: 15.5px; font-weight: 550;
            transition: border-color .16s ease, background .16s ease, transform .16s ease;
        }
        .tile:hover { border-color: #d9dcf0; background: #fafbff; transform: translateY(-1px); }
        .tile svg { width: 19px; height: 19px; stroke: var(--brand); flex: none; }
        .tile .pill {
            margin-left: auto; min-width: 22px; height: 21px; padding: 0 7px;
            border-radius: 11px; background: #fee2e2; color: var(--danger);
            font-size: 12.5px; font-weight: 650; line-height: 21px; text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .tile .pill.hide { display: none; }
        .tile.empty { color: var(--muted); }
        .tile.empty svg { stroke: var(--muted); }

        /* 危险操作 */
        .footnote { text-align: center; margin-top: 24px; }
        .link-danger {
            border: none; background: none; cursor: pointer;
            font-family: inherit; font-size: 13.5px; color: var(--muted);
            padding: 6px 12px; border-radius: 8px;
            transition: color .16s ease, background .16s ease;
        }
        .link-danger:hover { color: var(--danger); background: #fff1f1; }

        .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 17px; }

        @media (max-width: 480px) {
            body { padding: 20px 14px; align-items: flex-start; }
            .shell { padding: 26px 20px 18px; border-radius: 18px; }
            .brand { gap: 12px; margin-bottom: 22px; }
            .logo { width: 42px; height: 42px; border-radius: 13px; }
            .logo svg { width: 22px; height: 22px; }
            .brand h1 { font-size: 17.5px; }
            .brand p { font-size: 12.5px; }
            .stats { margin-bottom: 16px; gap: 10px; }
            .stat { padding: 13px 14px; gap: 10px; border-radius: 15px; }
            .stat-icon { width: 38px; height: 38px; border-radius: 12px; }
            .stat-icon svg { width: 19px; height: 19px; }
            .stat .num { font-size: 23px; }
            .stat .lbl { font-size: 11.5px; }
            .cta { height: 50px; font-size: 15px; padding: 0 16px; border-radius: 13px; }
            .cta svg { width: 17px; height: 17px; }
            .tiles { gap: 10px; }
            .tile { padding: 13px 14px; font-size: 13.5px; border-radius: 13px; }
            .tile svg { width: 16px; height: 16px; }
            .footnote { margin-top: 16px; }
            .link-danger { font-size: 12px; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="brand">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
            </div>
            <div>
                <h1>单人刷题</h1>
                <p>本地题库 · 自动解析 · 错题重练</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5.5A1.5 1.5 0 0 1 4 18.5z"/>
                        <path d="M8 4v16"/><path d="M12 9h5"/><path d="M12 13h5"/>
                    </svg>
                </div>
                <div class="stat-body">
                    <div class="num" id="questionCount">0</div>
                    <div class="lbl">题库题目</div>
                </div>
            </div>
            <div class="stat warn" id="wrongStat">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l8 4v5c0 4.6-3.3 7.9-8 9-4.7-1.1-8-4.4-8-9V7z"/>
                        <path d="M12 8.5v4"/><path d="M12 15.6h.01"/>
                    </svg>
                </div>
                <div class="stat-body">
                    <div class="num" id="wrongCount">0</div>
                    <div class="lbl">待攻克错题</div>
                </div>
            </div>
        </div>

        <a href="practice.html" class="cta">
            <span class="left">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
                </svg>
                开始刷题
            </span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
            </svg>
        </a>

        <div class="tiles">
            <a href="practice.html?mode=wrong" class="tile" id="wrongBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
                </svg>
                错题重练
                <span class="pill hide" id="wrongBadge">0</span>
            </a>
            <a href="upload.html" class="tile">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <path d="M7 9l5-5 5 5"/><path d="M12 4v12"/>
                </svg>
                上传题库
            </a>
        </div>

        <p class="hint" id="hint"></p>

        <div class="footnote">
            <button class="link-danger" onclick="clearQuestions()">清空题库与记录</button>
        </div>
    </main>

    <script>
        // 同源部署：页面与接口在同一个 Spring Boot 服务下，跟随实际主机/端口
        const API_BASE = '';

        function loadQuestionCount() {
            fetch(`${API_BASE}/api/questions/count`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('questionCount').textContent = data.total || 0;
                })
                .catch(err => console.log('获取题目数量失败:', err));
        }

        // 错题数：只有存在错题时才显示徽标，没有错题时入口置灰
        function loadWrongCount() {
            fetch(`${API_BASE}/api/answers/wrong`)
                .then(res => res.json())
                .then(data => {
                    const n = data.total || 0;
                    document.getElementById('wrongCount').textContent = n;

                    const card = document.getElementById('wrongBtn');
                    const badge = document.getElementById('wrongBadge');
                    badge.textContent = n;
                    badge.classList.toggle('hide', n === 0);
                    card.classList.toggle('empty', n === 0);
                    document.getElementById('wrongStat').classList.toggle('zero', n === 0);

                    document.getElementById('hint').textContent =
                        n === 0 ? '还没有错题，先刷一轮吧' : '';
                })
                .catch(err => console.log('获取错题数量失败:', err));
        }

        function clearQuestions() {
            const confirmed = confirm('⚠️ 确定要清空所有题目信息吗？\n\n此操作会删除所有题目、题库和答题记录，且不可恢复！');
            if (confirmed !== true) return;

            fetch(`${API_BASE}/api/questions/clear`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data && data.success) {
                        alert('✅ ' + data.message);
                        loadQuestionCount();
                        loadWrongCount();
                    } else {
                        alert('❌ ' + (data && data.message ? data.message : '清空失败'));
                    }
                })
                .catch(err => alert('❌ 清空失败：' + (err.message || '未知错误')));
        }

        loadQuestionCount();
        loadWrongCount();
    </script>
</body>
</html>
