<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单人刷题软件</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 760px; margin: 0 auto; padding: 48px 20px; }
        .card { background: white; border-radius: 24px; padding: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.28); }
        h1 { text-align: center; color: #2b2d42; margin-bottom: 8px; font-size: 34px; letter-spacing: 1px; }
        .subtitle { text-align: center; color: #8b8fa3; margin-bottom: 32px; font-size: 15px; }

        /* 统计条 */
        .stats { display: flex; background: #f6f7fb; border-radius: 16px; padding: 20px 10px; margin-bottom: 26px; }
        .stat { flex: 1; text-align: center; position: relative; }
        .stat + .stat::before { content: ''; position: absolute; left: 0; top: 15%; height: 70%; width: 1px; background: #e3e6f0; }
        .stat-num { font-size: 30px; font-weight: bold; color: #667eea; line-height: 1.2; }
        .stat-num.warn { color: #f5576c; }
        .stat-label { font-size: 13px; color: #8b8fa3; margin-top: 4px; }

        /* 功能卡片 2×2 */
        .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 9px; }
        .action {
            display: flex; align-items: center; gap: 14px;
            padding: 20px 20px; border-radius: 16px; border: 1.5px solid transparent;
            text-decoration: none; cursor: pointer; font-family: inherit; text-align: left;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
            background: #f6f7fb;
        }
        .action .ico {
            flex: none; width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 21px; background: #fff; box-shadow: 0 2px 8px rgba(31,38,135,.08);
        }
        .action .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .action .t { font-size: 16px; font-weight: 600; color: #2b2d42; display: flex; align-items: center; gap: 8px; }
        .action .d { font-size: 12.5px; color: #8b8fa3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .action:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(102,126,234,.18); background: #fff; border-color: #dfe3f5; }
        .action:active { transform: translateY(0); }

        /* 主操作：开始刷题 */
        .action.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 8px 22px rgba(102,126,234,.35);
        }
        .action.primary .ico { background: rgba(255,255,255,.22); color: #fff; box-shadow: none; }
        .action.primary .t { color: #fff; }
        .action.primary .d { color: rgba(255,255,255,.82); }
        .action.primary:hover { background: linear-gradient(135deg, #5c73e6 0%, #6b4399 100%); border-color: transparent; }

        /* 错题重练：带计数徽标 */
        .action.wrong { background: #fff5f7; }
        .action.wrong .ico { color: #f5576c; }
        .action.wrong:hover { border-color: #ffd3dc; }
        .badge {
            display: none; min-width: 22px; height: 20px; padding: 0 6px;
            border-radius: 10px; background: #f5576c; color: #fff;
            font-size: 12px; font-weight: 600; line-height: 20px; text-align: center;
        }
        .badge.show { display: inline-block; }
        .action.wrong.empty .badge { display: none; }

        /* 清空题目：低干扰的次要操作 */
        .action.danger { background: #fff; border-color: #eceef5; }
        .action.danger .ico { background: #fdf0f0; color: #d9534f; }
        .action.danger .t { color: #6b6f80; font-weight: 500; }
        .action.danger:hover { background: #fff6f6; border-color: #f7c9c9; box-shadow: 0 8px 20px rgba(217,83,79,.12); }
        .action.danger:hover .t { color: #d9534f; }

        .hint { text-align: center; font-size: 12.5px; color: #a8acbd; margin-bottom: 26px; }

        /* 特性 */
        .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-top: 24px; border-top: 1px solid #f0f1f6; }
        .feature { text-align: center; padding: 6px; }
        .feature-icon { font-size: 26px; margin-bottom: 6px; }
        .feature-title { font-weight: 600; color: #4a4e63; margin-bottom: 3px; font-size: 14px; }
        .feature-desc { color: #9ba0b1; font-size: 12px; }

        @media (max-width: 620px) {
            .container { padding: 24px 14px; }
            .card { padding: 28px 20px; border-radius: 20px; }
            h1 { font-size: 27px; }
            .subtitle { margin-bottom: 24px; font-size: 14px; }
            .actions { grid-template-columns: 1fr; gap: 12px; }
            .action { padding: 16px; }
            .stat-num { font-size: 26px; }
            .features { gap: 8px; }
            .feature-icon { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📚 单人刷题软件</h1>
            <p class="subtitle">高效学习，轻松刷题</p>

            <div class="stats">
                <div class="stat">
                    <div class="stat-num" id="questionCount">0</div>
                    <div class="stat-label">题库题目</div>
                </div>
                <div class="stat">
                    <div class="stat-num warn" id="wrongCount">0</div>
                    <div class="stat-label">待攻克错题</div>
                </div>
            </div>

            <div class="actions">
                <a href="practice.html" class="action primary">
                    <span class="ico">✏️</span>
                    <span class="txt">
                        <span class="t">开始刷题</span>
                        <span class="d">从上次进度继续</span>
                    </span>
                </a>
                <a href="practice.html?mode=wrong" class="action wrong" id="wrongBtn">
                    <span class="ico">🔁</span>
                    <span class="txt">
                        <span class="t">错题重练 <span class="badge" id="wrongBadge">0</span></span>
                        <span class="d">只刷错过的题</span>
                    </span>
                </a>
                <a href="upload.html" class="action">
                    <span class="ico">📤</span>
                    <span class="txt">
                        <span class="t">上传题库</span>
                        <span class="d">PDF / Word / 图片</span>
                    </span>
                </a>
                <button class="action danger" onclick="clearQuestions()">
                    <span class="ico">🗑️</span>
                    <span class="txt">
                        <span class="t">清空题目</span>
                        <span class="d">删除全部题库与记录</span>
                    </span>
                </button>
            </div>
            <p class="hint" id="hint"></p>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">📄</div>
                    <div class="feature-title">多格式支持</div>
                    <div class="feature-desc">PDF、Word、图片</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-title">智能解析</div>
                    <div class="feature-desc">自动提取题目答案</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <div class="feature-title">进度追踪</div>
                    <div class="feature-desc">记录答题情况</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 同源部署：页面与接口在同一个 Spring Boot 服务下，跟随实际主机/端口
        const API_BASE = '';

        function loadQuestionCount() {
            fetch(`${API_BASE}/api/questions/count`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('questionCount').textContent = data.total || 0;
                })
                .catch(err => {
                    console.log('获取题目数量失败:', err);
                });
        }

        // 错题数：错题卡片上挂计数徽标，没有错题时置灰提示
        function loadWrongCount() {
            fetch(`${API_BASE}/api/answers/wrong`)
                .then(res => res.json())
                .then(data => {
                    const n = data.total || 0;
                    document.getElementById('wrongCount').textContent = n;

                    const card = document.getElementById('wrongBtn');
                    const badge = document.getElementById('wrongBadge');
                    badge.textContent = n;
                    badge.classList.toggle('show', n > 0);
                    card.classList.toggle('empty', n === 0);

                    const hint = document.getElementById('hint');
                    hint.textContent = n === 0
                        ? '还没有错题，先去刷一轮吧'
                        : '';
                })
                .catch(err => {
                    console.log('获取错题数量失败:', err);
                });
        }

        function clearQuestions() {
            const confirmed = confirm('⚠️ 确定要清空所有题目信息吗？\n\n此操作会删除所有题目、题库和答题记录，且不可恢复！');

            if (confirmed !== true) {
                console.log('用户取消清空操作');
                return;
            }

            console.log('开始清空题目...');
            fetch(`${API_BASE}/api/questions/clear`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.success) {
                    alert('✅ ' + data.message);
                    loadQuestionCount();
                    loadWrongCount();
                } else {
                    alert('❌ ' + (data && data.message ? data.message : '清空失败'));
                }
            })
            .catch(err => {
                alert('❌ 清空失败：' + (err.message || '未知错误'));
            });
        }

        loadQuestionCount();
        loadWrongCount();
    </script>
</body>
</html>
