<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单人刷题软件</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .card { background: white; border-radius: 20px; padding: 50px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 36px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; font-size: 16px; }
        .btn-group { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .btn { padding: 16px 40px; border: none; border-radius: 50px; font-size: 18px; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; color: white; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-secondary { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .btn-danger { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .stats { background: #f8f9fa; border-radius: 12px; padding: 25px; text-align: center; }
        .stats p { font-size: 18px; color: #333; }
        .stats span { font-size: 32px; font-weight: bold; color: #667eea; }
        .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .feature { text-align: center; padding: 20px; }
        .feature-icon { font-size: 36px; margin-bottom: 10px; }
        .feature-title { font-weight: bold; color: #333; margin-bottom: 5px; }
        .feature-desc { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📚 单人刷题软件</h1>
            <p class="subtitle">高效学习，轻松刷题</p>
            
            <div class="btn-group">
                <a href="upload.html" class="btn btn-primary">📤 上传题库</a>
                <a href="practice.html" class="btn btn-secondary">✏️ 开始刷题</a>
                <button class="btn btn-danger" onclick="clearQuestions()">🗑️ 清空题目</button>
            </div>
            
            <div class="stats" id="stats">
                <p>题库中共有 <span id="questionCount">0</span> 道题目</p>
            </div>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">📄</div>
                    <div class="feature-title">多格式支持</div>
                    <div class="feature-desc">PDF、Word、图片</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-title">智能解析</div>
                    <div class="feature-desc">自动提取题目答案</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <div class="feature-title">进度追踪</div>
                    <div class="feature-desc">记录答题情况</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 同源部署：页面与接口在同一个 Spring Boot 服务下，跟随实际主机/端口
        const API_BASE = '';

        function loadQuestionCount() {
            fetch(`${API_BASE}/api/questions/count`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('questionCount').textContent = data.total;
                })
                .catch(err => {
                    console.log('获取题目数量失败:', err);
                });
        }

        function clearQuestions() {
            const confirmed = confirm('⚠️ 确定要清空所有题目信息吗？\n\n此操作会删除所有题目、题库和答题记录，且不可恢复！');
            
            if (confirmed !== true) {
                console.log('用户取消清空操作');
                return;
            }
            
            console.log('开始清空题目...');
            fetch(`${API_BASE}/api/questions/clear`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.success) {
                    alert('✅ ' + data.message);
                    loadQuestionCount();
                } else {
                    alert('❌ ' + (data && data.message ? data.message : '清空失败'));
                }
            })
            .catch(err => {
                alert('❌ 清空失败：' + (err.message || '未知错误'));
            });
        }

        loadQuestionCount();
    </script>
</body>
</html>
